      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="cyanocosmos01-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.64"/>
    </filter>
    <filter id="cyanocosmos01-halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.0"/>
    </filter>
    <radialGradient id="cyanocosmos01-vig" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2C5A8C" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#1E4068" stop-opacity="0"/>
      <stop offset="1" stop-color="#14304F" stop-opacity="0.75"/>
    </radialGradient>
  </defs>
