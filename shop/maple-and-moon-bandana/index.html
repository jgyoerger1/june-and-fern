 Ohio"},"description":"A heavyweight cotton tee printed with lady fern fronds gathered from the creek bank behind the studio. The fronds were laid flat on the shirt and left in full sun for twenty minutes, so every spore dot and curled tip is there in white against deep blue.\n\nThe shirt was secondhand before it was blue: soft, broken in, no holes. The print wraps slightly over the left shoulder. One of one."},{"id":"p_lacedress","slug":"queen-annes-lace-linen-dress","title":"Queen Anne's Lace Linen Dress","size":"S","category":"cyanotype","price_cents":18500,"compare_at_cents":null,"status":"available","one_of_one":true,"quantity":1,"reserved":false,"featured":true,"created_at":1789344000000,"sold_at":null,"images":[{"url":"/june-and-fern/img/demo/cyano-lace-01.svg","alt":"Queen Anne's Lace Linen Dress, front","width":1200,"height":1500},{"url":"/june-and-fern/img/demo/cyano-lace-02.svg","alt":"Queen Anne's Lace Linen Dress, detail of the umbels","width":1200,"height":1500}],"details":{"botanicals":["Queen Anne's lace","Yarrow leaf"],"fabric":"100% linen, deadstock","care":"Cold wash inside out, line dry in shade. The blue deepens with the first few washes. Iron on the reverse while damp.","measurements":{"Chest":"36 in","Length":"38 in","Waist":"38 in"},"fit":"Straight shift, roomy through the hip","origin":"Printed by hand in Northeast Ohio"},"description":"A sleeveless linen shift printed with Queen Anne's lace cut the same morning it was exposed. The umbels sit across the chest and scatter down the skirt, each tiny floret showing as a point of white. Linen takes the chemistry unevenly, so the blue has a soft, watery grain to it.\n\nSide seam pockets, a short back slit, and a bias-bound neckline. The dress itself was deadstock from an Ohio sewing shop that closed in 2019. One of one."},{"id":"p_meadow","slug":"meadow-grass-button-up","title":"Meadow Grass Button-Up","size":"L","category":"cyanotype","price_cents":12000,"compare_at_cents":14000,"status":"available","one_of_one":true,"quantity":1,"reserved":false,"featured":false,"created_at":1789516800000,"sold_at":null,"images":[{"url":"/june-and-fern/img/demo/cyano-grass-01.svg","alt":"Meadow Grass Button-Up with grass seed heads up the front","width":1200,"height":1500}],"details":{"botanicals":["Timothy grass","Orchard grass"],"fabric":"100% cotton poplin, secondhand","care":"Cold wash inside out, line dry in shade. The blue deepens with the first few washes.","measurements":{"Chest":"46 in","Length":"30 in","Sleeve":"9 in"},"fit":"Boxy camp shirt, wear it open or buttoned","origin":"Printed by hand in Northeast Ohio"},"description":"A camp-collar cotton shirt printed with timothy grass and orchard grass seed heads from the field at the end of our road. The stems run up the front panels and over the pocket like a tall August meadow. The back is plain blue.\n\nCoconut buttons, straight hem, a single chest pocket. The shirt came from a church rummage sale with the tags still on. Marked down because one cuff took the sun a little brighter than the other, which we like."}]}</script>
